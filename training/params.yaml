# TinyDet Training Parameters
# These parameters are tracked by DVC for reproducibility

# Model configuration
model:
  num_classes: 4
  input_width: 320
  input_height: 192
  # Output grid is input / stride (16)
  grid_width: 20
  grid_height: 12

# Class definitions
classes:
  - person
  - vehicle
  - cat
  - dog

# Data preparation
prepare:
  coco_dir: "coco"
  oxford_pets_dir: "oxford_pets"
  output_dir: "combined_dataset"
  max_person_images: 10000
  max_vehicle_images: 10000
  val_split: 0.1
  random_seed: 42

# Training configuration
train:
  epochs: 10  # Reduced for local testing - increase for full training
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  warmup_epochs: 5
  # Loss weights
  obj_loss_weight: 5.0
  box_loss_weight: 2.0
  cls_loss_weight: 1.0
  # Augmentation
  mosaic_prob: 0.3
  label_smoothing: 0.02
  # Checkpointing
  save_every: 10
  output_dir: "runs/current"

# Evaluation
evaluate:
  conf_threshold: 0.25
  nms_threshold: 0.45
  iou_threshold: 0.5

# Export configuration
export:
  opset_version: 13
  fuse_bn: true
  # Float32 export
  float_output: "models/tinydet_float.onnx"
  # INT8 quantized export  
  int8_output: "models/tinydet_int8.onnx"
  calibration_samples: 500

# Quantization settings
quantize:
  method: "qat"  # ptq (post-training) or qat (quantization-aware training)
  calibration_batches: 100
  per_channel: true

